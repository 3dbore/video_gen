<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width={{WIDTH}}, height={{HEIGHT}}" />
    <title>{{TITLE}}</title>
    <script src="gsap.min.js"></script>
    <script src="timing.js"></script>
    <script src="data.js"></script>
    <style>
      /* Scaffold only. The motion job replaces this look with the one in spec.md. */
      :root {
        --ground: #101114;
        --ink: #f4f2ec;
        --accent: #ffb000;
        --font-display: "Segoe UI", Arial, sans-serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: {{WIDTH}}px;
        height: {{HEIGHT}}px;
        overflow: hidden;
        background: var(--ground);
      }
      #root { position: relative; width: 100%; height: 100%; font-family: var(--font-display); color: var(--ink); }
      .clip { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: var(--ground); }
      .title { font-size: 96px; font-weight: 700; letter-spacing: -0.03em; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="{{DURATION}}" data-width="{{WIDTH}}" data-height="{{HEIGHT}}">
{{SECTIONS}}
    </div>
    <script src="runtime.js"></script>
    <script>
      const tl = gsap.timeline({ paused: true });
      // Every position is cue("name") from timing.js. Never write a bare number here.
{{ANIMATIONS}}
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
