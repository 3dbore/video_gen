<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>NOS-02: Lengan robot open source dari motor servo murah</title>
    <script src="gsap.min.js"></script>
    <script src="timing.js"></script>
    <script src="data.js"></script>
    <style>
      /* Scaffold only. The motion job replaces this look with the one in spec.md. */
      :root {
        --ground: #101114;
        --ink: #f4f2ec;
        --accent: #ffb000;
        --font-display: "Segoe UI", Arial, sans-serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--ground);
      }
      #root { position: relative; width: 100%; height: 100%; font-family: var(--font-display); color: var(--ink); }
      .clip { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: var(--ground); }
      .title { font-size: 96px; font-weight: 700; letter-spacing: -0.03em; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="45" data-width="1080" data-height="1920">
      <section id="hook" class="clip" data-scene="hook"><h1 class="title">Hook</h1></section>
      <section id="desain_gratis" class="clip" data-scene="desain_gratis"><h1 class="title">Desain gratis</h1></section>
      <section id="tiga_bagian" class="clip" data-scene="tiga_bagian"><h1 class="title">Tiga bagian</h1></section>
      <section id="harga_motor" class="clip" data-scene="harga_motor"><h1 class="title">Harga motor</h1></section>
      <section id="jujur_soal_harga" class="clip" data-scene="jujur_soal_harga"><h1 class="title">Jujur soal harga</h1></section>
      <section id="ajakan" class="clip" data-scene="ajakan"><h1 class="title">Ajakan</h1></section>
    </div>
    <script src="runtime.js"></script>
    <script>
      const tl = gsap.timeline({ paused: true });
      // Every position is cue("name") from timing.js. Never write a bare number here.
      tl.from("#hook .title", { opacity: 0, y: 30, duration: 0.4, ease: "power3.out" }, cue("hook_in"));
      tl.from("#desain_gratis .title", { opacity: 0, y: 30, duration: 0.4, ease: "power3.out" }, cue("desain_gratis_in"));
      tl.from("#tiga_bagian .title", { opacity: 0, y: 30, duration: 0.4, ease: "power3.out" }, cue("tiga_bagian_in"));
      tl.from("#harga_motor .title", { opacity: 0, y: 30, duration: 0.4, ease: "power3.out" }, cue("harga_motor_in"));
      tl.from("#jujur_soal_harga .title", { opacity: 0, y: 30, duration: 0.4, ease: "power3.out" }, cue("jujur_soal_harga_in"));
      tl.from("#ajakan .title", { opacity: 0, y: 30, duration: 0.4, ease: "power3.out" }, cue("ajakan_in"));
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
